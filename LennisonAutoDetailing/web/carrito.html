<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Carrito | Lennison Auto Detailing</title>
    
    <!-- Biblioteca de íconos vectoriales FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- DISEÑO DE INTERFAZ PREMIUM INTEGRADO --- */
        :root {
            --color-bg: #000000;            /* Negro */
            --color-acento: #8B0000;        /* Rojo oscuro */
            --color-acento-hover: #b30000;  /* Rojo un poco más claro */
            --color-texto: #FFFFFF;         /* Blanco */
            --color-input-bg: #212121;      /* Gris oscuro */
            --color-border: #333333;        /* Borde gris */
            --radius-md: 8px;
            --radius-lg: 12px;
            --transition: all 0.3s ease;
            --shadow-sm: 0 2px 4px rgba(0,0,0,0.2);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--color-bg);
            color: var(--color-texto);
            margin: 0;
            padding: 0;
            display: block;
            min-height: 100vh;
        }

        /* --- Barra de Navegación --- */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 5%;
            background-color: var(--color-input-bg);
            border-bottom: 1px solid var(--color-border);
            box-shadow: var(--shadow-sm);
        }

        .navbar-brand {
            font-family: 'Michroma', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            text-decoration: none;
            color: var(--color-texto);
            text-transform: uppercase;
        }

        .navbar-brand span {
            color: var(--color-acento);
        }

        .navbar-menu {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .cart-wrapper {
            position: relative;
            text-decoration: none;
            color: inherit;
            font-size: 1.4rem;
            transition: var(--transition);
        }

        .cart-wrapper:hover {
            transform: scale(1.1);
            color: var(--color-acento);
        }

        .cart-badge {
            position: absolute;
            top: -5px;
            right: -10px;
            background-color: var(--color-acento);
            color: white;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 50%;
        }

        .btn-logout {
            padding: 0.6rem 1.2rem;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            background-color: transparent;
            color: var(--color-acento);
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-logout:hover {
            background-color: var(--color-acento);
            color: var(--color-texto);
            border-color: var(--color-acento);
        }

        /* --- Contenedor Principal --- */
        .dashboard-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 5%;
        }

        .header-tienda {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--color-border);
            padding-bottom: 15px;
        }

        .header-tienda h2 {
            font-family: 'Michroma', sans-serif;
            font-size: 1.3rem;
            margin: 0;
            text-transform: uppercase;
        }

        .btn-volver {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background-color: var(--color-input-bg);
            color: var(--color-texto);
            text-decoration: none;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            font-weight: 600;
            transition: var(--transition);
        }

        .btn-volver:hover {
            border-color: var(--color-acento);
            color: var(--color-acento);
        }

        /* --- Diseño de Tabla Estilizada --- */
        .tabla-carrito {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 10px;
            margin-top: 20px;
        }

        .tabla-carrito th {
            font-family: 'Michroma', sans-serif;
            text-transform: uppercase;
            font-size: 0.8rem;
            color: #888888;
            padding: 12px 20px;
            text-align: left;
            letter-spacing: 1px;
        }

        .tabla-carrito tbody tr {
            background-color: var(--color-input-bg);
            border: 1px solid var(--color-border);
            transition: var(--transition);
        }

        .tabla-carrito tbody tr:hover {
            border-color: var(--color-acento);
            transform: scale(1.002);
        }

        .tabla-carrito td {
            padding: 18px 20px;
            color: var(--color-texto);
            vertical-align: middle;
            border-top: 1px solid var(--color-border);
            border-bottom: 1px solid var(--color-border);
        }

        .tabla-carrito td:first-child {
            border-left: 1px solid var(--color-border);
            border-top-left-radius: 8px;
            border-bottom-left-radius: 8px;
        }
        
        .tabla-carrito td:last-child {
            border-right: 1px solid var(--color-border);
            border-top-right-radius: 8px;
            border-bottom-right-radius: 8px;
        }

        /* Insignias de Clasificación */
        .tipo-badge {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 4px;
            letter-spacing: 0.5px;
            margin-top: 6px;
        }
        .tipo-producto {
            background-color: rgba(52, 152, 219, 0.15);
            color: #3498db;
            border: 1px solid rgba(52, 152, 219, 0.3);
        }
        .tipo-servicio {
            background-color: rgba(155, 89, 182, 0.15);
            color: #9b59b6;
            border: 1px solid rgba(155, 89, 182, 0.3);
        }

        /* Controles de cantidad */
        .control-cantidad {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-cantidad {
            background-color: var(--color-bg);
            border: 1px solid var(--color-border);
            color: var(--color-texto);
            width: 32px;
            height: 32px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-cantidad:hover {
            border-color: var(--color-acento);
            background-color: var(--color-acento);
            color: #fff;
        }

        .btn-eliminar {
            background: transparent;
            color: #888888;
            border: none;
            font-size: 1.1rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-eliminar:hover {
            color: var(--color-acento);
            transform: scale(1.15);
        }

        /* --- Barra de Resumen del Pago --- */
        .carrito-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
            padding: 24px 30px;
            background-color: var(--color-input-bg);
            border: 1px solid var(--color-border);
            border-left: 5px solid var(--color-acento);
            border-radius: var(--radius-md);
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }

        .carrito-total-texto {
            font-size: 0.9rem;
            color: #888888;
            letter-spacing: 1px;
            display: block;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .carrito-total-valor {
            font-family: 'Michroma', sans-serif;
            font-size: 1.8rem;
            color: var(--color-texto);
        }

        .btn-principal {
            width: auto;
            padding: 15px 40px;
            background-color: var(--color-acento);
            color: var(--color-texto);
            border: none;
            border-radius: var(--radius-md);
            font-family: 'Michroma', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-principal:hover {
            background-color: var(--color-acento-hover);
            box-shadow: 0 4px 12px rgba(139, 0, 0, 0.4);
        }

        /* --- Carrito Vacío --- */
        .carrito-vacio {
            text-align: center;
            padding: 60px 40px;
            background-color: var(--color-input-bg);
            border-radius: var(--radius-lg);
            border: 1px dashed var(--color-border);
        }

        .vacio-icon {
            font-size: 4rem;
            color: var(--color-acento);
            margin-bottom: 15px;
        }

        .carrito-vacio h3 {
            font-family: 'Michroma', sans-serif;
            font-size: 1.2rem;
            margin-bottom: 25px;
            text-transform: uppercase;
        }/* 1. Ajuste del contenedor de la barra de navegación */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.3rem 5% !important; /* Mantiene la barra compacta */
            background-color: var(--color-input-bg);
            border-bottom: 1px solid var(--color-border);
            box-shadow: var(--shadow-sm);
        }
        /* 2. Contenedor del logo con máscara de recorte (overflow: hidden) */
        .navbar-brand-logo {
            display: flex;
            align-items: center;
            text-decoration: none;
            height: 60px;       /* Altura del recuadro visible */
            width: 160px;       /* Ancho del recuadro visible */
            overflow: hidden;   /* Oculta y recorta los bordes negros que sobresalgan */
            position: relative;
        }

        /* 3. Imagen con zoom aplicado */
        .logo-navbar {
            height: 100%;
            width: 100%;
            object-fit: cover;   /* Ajusta la imagen para cubrir el contenedor */
            transform: scale(1.0); /* Aplica un 40% de zoom hacia el centro del logo */
            transform-origin: center;
            transition: all 0.3s ease;
        }

        .logo-navbar:hover {
            transform: scale(1.1); /* Efecto interactivo sutil sobre el zoom */
        }
    </style>
</head>
<body style="display: block;">

    <nav class="navbar">
        <a href="/inicio-usuario" class="navbar-brand-logo" style="color: white; font-family: 'Michroma', sans-serif; text-decoration: none; font-size: 1.2rem; font-weight: bold; text-transform: uppercase; display: flex; align-items: center; width: auto; height: auto;">
            Lennison <span style="color: var(--color-acento); margin-left: 5px;">Detailing</span>
        </a>
        <div class="navbar-menu">
            <a href="/carrito" class="cart-wrapper" title="Ir al Carrito">
                <i class="fa-solid fa-cart-shopping"></i><span class="cart-badge" id="cart-badge">{{CANTIDAD_CARRITO}}</span>
            </a>
            <a href="/logout" class="btn-logout" style="text-decoration: none;">
                <i class="fa-solid fa-arrow-right-from-bracket"></i> Cerrar Sesión
            </a>
        </div>
    </nav>

    <main class="dashboard-container">
        <div class="header-tienda">
            <h2>Mi Carrito de Compras</h2>
            <a href="/inicio-usuario" class="btn-volver">
                <i class="fa-solid fa-arrow-left"></i> Volver al Panel
            </a>
        </div>

        {{CARRITO_VISTA}}
    </main>

</body>
</html>
