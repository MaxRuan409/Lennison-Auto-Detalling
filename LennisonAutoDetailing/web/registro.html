<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta | Lennison Auto Detailing</title>
    
    <!-- Biblioteca de íconos vectoriales FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- DISEÑO DE INTERFAZ PREMIUM INTEGRADO --- */
        :root {
            --color-bg: #000000;            /* Negro */
            --color-acento: #8B0000;        /* Rojo oscuro */
            --color-acento-hover: #b30000;  /* Rojo un poco más claro */
            --color-texto: #FFFFFF;         /* Blanco */
            --color-input-bg: #212121;      /* Gris oscuro */
            --color-border: #333333;        /* Borde gris */
            --radius-md: 8px;
            --radius-lg: 12px;
            --transition: all 0.3s ease;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--color-bg);
            color: var(--color-texto);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .contenedor-auth {
            background-color: var(--color-input-bg);
            padding: 40px;
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid var(--color-border);
        }

        .logo-auth {
            font-family: 'Michroma', sans-serif;
            text-align: center;
            font-size: 1.4rem;
            margin-bottom: 30px;
            color: var(--color-texto);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .logo-auth span {
            color: var(--color-acento);
        }

        .grupo-input {
            margin-bottom: 20px;
        }

        .grupo-input label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: #aaaaaa;
            font-weight: 600;
        }

        .grupo-input input {
            width: 100%;
            padding: 12px 16px;
            background-color: var(--color-bg);
            border: 1px solid var(--color-border);
            color: var(--color-texto);
            border-radius: var(--radius-md);
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            outline: none;
            transition: var(--transition);
            box-sizing: border-box;
        }

        .grupo-input input:focus {
            border-color: var(--color-acento);
            box-shadow: 0 0 8px rgba(139, 0, 0, 0.2);
        }

        .btn-principal {
            width: 100%;
            padding: 14px;
            background-color: var(--color-acento);
            color: var(--color-texto);
            border: none;
            border-radius: var(--radius-md);
            font-family: 'Michroma', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-principal:hover {
            background-color: var(--color-acento-hover);
            box-shadow: 0 5px 15px rgba(139, 0, 0, 0.4);
        }

        .enlaces-auth {
            margin-top: 25px;
            text-align: center;
            font-size: 0.85rem;
        }

        .enlaces-auth a {
            color: #aaaaaa;
            text-decoration: none;
            display: block;
            transition: var(--transition);
        }

        .enlaces-auth a:hover {
            color: var(--color-texto);
        }

        .enlaces-auth .destacado {
            color: var(--color-acento);
            font-weight: 600;
        }

        /* Toasts de Notificación */
        #toast-contenedor {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 12px;
            pointer-events: none;
        }

        .toast {
            min-width: 280px;
            max-width: 380px;
            padding: 14px 18px;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            line-height: 1.4;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .toast.toast-visible {
            opacity: 1;
            transform: translateY(0);
        }

        .toast-error {
            background-color: var(--color-acento);
            color: var(--color-texto);
            border: 1px solid var(--color-acento-hover);
        }

        .toast-exito {
            background-color: var(--color-input-bg);
            color: var(--color-texto);
            border: 2px solid var(--color-acento);
        }
    </style>
</head>
<body>

    <div class="contenedor-auth">
        <h1 class="logo-auth">Lennison <span>Detailing</span></h1>
        
        {{MENSAJE_REGISTRO}}
        
        <form action="/registro" method="POST">
            <div class="grupo-input">
                <label for="nombre">Nombre Completo</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan Pérez" required>
            </div>

            <div class="grupo-input">
                <label for="telefono">Teléfono</label>
                <input type="tel" id="telefono" name="telefono" placeholder="Ej: 555-1234" required>
            </div>

            <div class="grupo-input">
                <label for="correo">Correo Electrónico</label>
                <input type="email" id="correo" name="correo" required autocomplete="email" placeholder="ejemplo@correo.com">
            </div>
            
            <div class="grupo-input">
                <label for="clave">Contraseña</label>
                <input type="password" id="clave" name="clave" required autocomplete="new-password" placeholder="Mínimo 6 caracteres">
            </div>

            <div class="grupo-input">
                <label for="confirmar-clave">Confirmar Contraseña</label>
                <input type="password" id="confirmar-clave" name="confirmarClave" required autocomplete="new-password" placeholder="Repite tu contraseña">
            </div>
            
            <button type="submit" class="btn-principal">
                <i class="fa-solid fa-user-plus"></i> Crear Cuenta
            </button>
        </form>

        <div class="enlaces-auth">
            <a href="/login">¿Ya tienes cuenta? <span class="destacado">Inicia Sesión</span></a>
        </div>
    </div>

</body>
</html>
