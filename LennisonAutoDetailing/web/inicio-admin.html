<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | Lennison Auto Detailing</title>
    
    <!-- Biblioteca de íconos vectoriales FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- DISEÑO DE INTERFAZ PREMIUM INTEGRADO --- */
        :root {
            --color-bg: #000000;            /* Negro */
            --color-acento: #8B0000;        /* Rojo oscuro */
            --color-acento-hover: #b30000;  /* Rojo un poco más claro */
            --color-texto: #FFFFFF;         /* Blanco */
            --color-input-bg: #212121;      /* Gris oscuro */
            --color-border: #333333;        /* Borde gris */
            --radius-md: 8px;
            --radius-lg: 12px;
            --transition: all 0.3s ease;
            --shadow-sm: 0 2px 4px rgba(0,0,0,0.2);
            --shadow-md: 0 4px 10px rgba(0,0,0,0.4);
            --shadow-hover: 0 10px 15px rgba(139, 0, 0, 0.2);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--color-bg);
            color: var(--color-texto);
            margin: 0;
            padding: 0;
            display: block;
            min-height: 100vh;
        }

        /* --- Barra de Navegación --- */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 5%;
            background-color: var(--color-input-bg);
            border-bottom: 1px solid var(--color-border);
            box-shadow: var(--shadow-sm);
        }

        .navbar-brand {
            font-family: 'Michroma', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            text-decoration: none;
            color: var(--color-texto);
            text-transform: uppercase;
        }

        .navbar-brand span {
            color: var(--color-acento);
        }

        .btn-logout {
            padding: 0.6rem 1.2rem;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            background-color: transparent;
            color: var(--color-acento);
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-logout:hover {
            background-color: var(--color-acento);
            color: var(--color-texto);
            border-color: var(--color-acento);
        }

        /* --- Contenedor Principal --- */
        .dashboard-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 5%;
        }

        .saludo-usuario {
            font-size: 1.8rem;
            margin-bottom: 30px;
            font-weight: 400;
        }

        .saludo-usuario span {
            font-family: 'Michroma', sans-serif;
            font-weight: 700;
            color: var(--color-acento);
        }

        /* --- Métricas / Resumen Grid --- */
        .resumen-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .card-resumen {
            background-color: var(--color-input-bg);
            border: 1px solid var(--color-border);
            border-left: 5px solid var(--color-acento);
            border-radius: var(--radius-md);
            padding: 24px;
            box-shadow: var(--shadow-md);
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: var(--transition);
        }

        .card-resumen:hover {
            transform: translateY(-3px);
            border-color: var(--color-acento);
        }

        .resumen-titulo {
            font-size: 0.85rem;
            color: #aaaaaa;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .resumen-valor {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--color-texto);
            font-family: 'Michroma', sans-serif;
        }

        hr {
            border: 0;
            border-top: 1px solid var(--color-border);
            margin-bottom: 40px;
        }

        /* --- Grid del Menú de Opciones --- */
        .grid-menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 25px;
        }

        .card-menu {
            background-color: var(--color-input-bg);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: 40px 20px;
            text-align: center;
            text-decoration: none;
            color: var(--color-texto);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            box-shadow: var(--shadow-md);
        }

        .card-menu:hover {
            transform: translateY(-8px);
            border-color: var(--color-acento);
            box-shadow: var(--shadow-hover);
        }

        .card-icon {
            font-size: 3rem;
            color: var(--color-acento);
            transition: var(--transition);
        }

        .card-menu:hover .card-icon {
            transform: scale(1.1);
        }

        .card-title {
            font-family: 'Michroma', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Toasts de Notificación */
        #toast-contenedor {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 12px;
            pointer-events: none;
        }

        .toast {
            min-width: 280px;
            max-width: 380px;
            padding: 14px 18px;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            line-height: 1.4;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .toast.toast-visible {
            opacity: 1;
            transform: translateY(0);
        }

        .toast-error {
            background-color: var(--color-acento);
            color: var(--color-texto);
            border: 1px solid var(--color-acento-hover);
        }

        .toast-exito {
            background-color: var(--color-input-bg);
            color: var(--color-texto);
            border: 2px solid var(--color-acento);
        }/* 1. Ajuste del contenedor de la barra de navegación */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.3rem 5% !important; /* Mantiene la barra compacta */
            background-color: var(--color-input-bg);
            border-bottom: 1px solid var(--color-border);
            box-shadow: var(--shadow-sm);
        }
        /* 2. Contenedor del logo con máscara de recorte (overflow: hidden) */
        .navbar-brand-logo {
            display: flex;
            align-items: center;
            text-decoration: none;
            height: 60px;       /* Altura del recuadro visible */
            width: 160px;       /* Ancho del recuadro visible */
            overflow: hidden;   /* Oculta y recorta los bordes negros que sobresalgan */
            position: relative;
        }

        /* 3. Imagen con zoom aplicado */
        .logo-navbar {
            height: 100%;
            width: 100%;
            object-fit: cover;   /* Ajusta la imagen para cubrir el contenedor */
            transform: scale(1.0); /* Aplica un 40% de zoom hacia el centro del logo */
            transform-origin: center;
            transition: all 0.3s ease;
        }

        .logo-navbar:hover {
            transform: scale(1.1); /* Efecto interactivo sutil sobre el zoom */
        }
    </style>
</head>
<body style="display: block;">

    <nav class="navbar">
        <a href="/admin" class="navbar-brand-logo" style="color: white; font-family: 'Michroma', sans-serif; text-decoration: none; font-size: 1.2rem; font-weight: bold; text-transform: uppercase; display: flex; align-items: center; width: auto; height: auto;">
            Lennison <span style="color: var(--color-acento); margin-left: 5px;">Detailing</span>
        </a>
        
        <div class="navbar-menu">
            <a href="/logout" class="btn-logout" style="text-decoration: none;">
                <i class="fa-solid fa-arrow-right-from-bracket"></i> Cerrar Sesión
            </a>
        </div>
    </nav>

    <main class="dashboard-container">
        <h2 class="saludo-usuario">Centro de Mando, <span id="nombre-display">Admin</span></h2>

        <!-- Grid de Métricas Generales del Negocio -->
        <div class="resumen-grid">
            <div class="card-resumen">
                <div class="resumen-titulo">Productos en Catálogo</div>
                <div class="resumen-valor" id="total-productos">{{TOTAL_PRODUCTOS}}</div>
            </div>
            <div class="card-resumen">
                <div class="resumen-titulo">Servicios Activos</div>
                <div class="resumen-valor" id="total-servicios">{{TOTAL_SERVICIOS}}</div>
            </div>
            <div class="card-resumen">
                <div class="resumen-titulo">Pedidos Pendientes</div>
                <div class="resumen-valor" id="total-pedidos">{{TOTAL_PEDIDOS}}</div>
            </div>
        </div>

        <hr style="border: 0; border-top: 1px solid var(--color-border); margin: 30px 0;">

        <!-- Menú de Acciones CRUD -->
        <div class="grid-menu">
            <a href="/admin/productos/agregar" class="card-menu">
                <div class="card-icon"><i class="fa-solid fa-folder-plus"></i></div>
                <div class="card-title">Agregar Producto</div>
            </a>
            
            <a href="/admin/servicios/agregar" class="card-menu">
                <div class="card-icon"><i class="fa-solid fa-circle-plus"></i></div>
                <div class="card-title">Agregar Servicio</div>
            </a>

            <a href="/admin/productos" class="card-menu">
                <div class="card-icon"><i class="fa-solid fa-boxes-stacked"></i></div>
                <div class="card-title">Gestionar Productos</div>
            </a>

            <a href="/admin/servicios" class="card-menu">
                <div class="card-icon"><i class="fa-solid fa-list-check"></i></div>
                <div class="card-title">Gestionar Servicios</div>
            </a>

            <a href="/admin/pedidos" class="card-menu">
                <div class="card-icon"><i class="fa-solid fa-receipt"></i></div>
                <div class="card-title">Gestionar Pedidos</div>
            </a>
        </div>
    </main>

</body>
</html>
