<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionar Pedidos | Lennison Auto Detailing</title>
    
    <!-- Biblioteca de íconos vectoriales FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- DISEÑO DE INTERFAZ PREMIUM INTEGRADO --- */
        :root {
            --color-bg: #000000;            /* Negro */
            --color-acento: #8B0000;        /* Rojo oscuro */
            --color-acento-hover: #b30000;  /* Rojo un poco más claro */
            --color-texto: #FFFFFF;         /* Blanco */
            --color-input-bg: #212121;      /* Gris oscuro */
            --color-border: #333333;        /* Borde gris */
            --radius-md: 8px;
            --radius-lg: 12px;
            --transition: all 0.3s ease;
            --shadow-sm: 0 2px 4px rgba(0,0,0,0.2);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--color-bg);
            color: var(--color-texto);
            margin: 0;
            padding: 0;
            display: block;
            min-height: 100vh;
        }

        /* --- Barra de Navegación --- */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.3rem 5% !important; /* Mantiene la barra compacta */
            background-color: var(--color-input-bg);
            border-bottom: 1px solid var(--color-border);
            box-shadow: var(--shadow-sm);
        }

        .navbar-brand-logo {
            display: flex;
            align-items: center;
            text-decoration: none;
            height: 60px;       /* Altura del recuadro visible */
            width: 160px;       /* Ancho del recuadro visible */
            overflow: hidden;   /* Oculta y recorta los bordes negros que sobresalgan */
            position: relative;
        }

        /* --- Contenedor Principal --- */
        .dashboard-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 5%;
        }

        .header-tienda {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--color-border);
            padding-bottom: 15px;
        }

        .header-tienda h2 {
            font-family: 'Michroma', sans-serif;
            font-size: 1.3rem;
            margin: 0;
            text-transform: uppercase;
        }

        .btn-volver {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background-color: var(--color-input-bg);
            color: var(--color-texto);
            text-decoration: none;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            font-weight: 600;
            transition: var(--transition);
        }

        .btn-volver:hover {
            border-color: var(--color-acento);
            color: var(--color-acento);
        }

        /* --- Diseño de Tabla Estilizada --- */
        .tabla-carrito {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 10px;
            margin-top: 20px;
        }

        .tabla-carrito th {
            font-family: 'Michroma', sans-serif;
            text-transform: uppercase;
            font-size: 0.8rem;
            color: #888888;
            padding: 12px 20px;
            text-align: left;
            letter-spacing: 1px;
        }

        .tabla-carrito tbody tr {
            background-color: var(--color-input-bg);
            border: 1px solid var(--color-border);
            transition: var(--transition);
        }

        .tabla-carrito tbody tr:hover {
            border-color: var(--color-acento);
            transform: scale(1.002);
        }

        .tabla-carrito td {
            padding: 18px 20px;
            color: var(--color-texto);
            vertical-align: middle;
            border-top: 1px solid var(--color-border);
            border-bottom: 1px solid var(--color-border);
        }

        .tabla-carrito td:first-child {
            border-left: 1px solid var(--color-border);
            border-top-left-radius: 8px;
            border-bottom-left-radius: 8px;
        }
        
        .tabla-carrito td:last-child {
            border-right: 1px solid var(--color-border);
            border-top-right-radius: 8px;
            border-bottom-right-radius: 8px;
        }

        .btn-logout {
            padding: 0.6rem 1.2rem;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            background-color: transparent;
            color: var(--color-acento);
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-logout:hover {
            background-color: var(--color-acento);
            color: var(--color-texto);
            border-color: var(--color-acento);
        }
    </style>
</head>
<body style="display: block;">

    <nav class="navbar">
        <a href="/admin" class="navbar-brand-logo" style="color: white; font-family: 'Michroma', sans-serif; text-decoration: none; font-size: 1.2rem; font-weight: bold; text-transform: uppercase; display: flex; align-items: center; width: auto; height: auto;">
            Lennison <span style="color: var(--color-acento); margin-left: 5px;">Detailing</span>
        </a>
        <div class="navbar-menu">
            <a href="/logout" class="btn-logout" style="text-decoration: none;">
                <i class="fa-solid fa-arrow-right-from-bracket"></i> Cerrar Sesión
            </a>
        </div>
    </nav>

    <main class="dashboard-container">
        <div class="header-tienda">
            <h2>Gestionar Pedidos</h2>
            <a href="/admin" class="btn-volver">
                <i class="fa-solid fa-arrow-left"></i> Volver al Panel
            </a>
        </div>

        <div style="overflow-x: auto;">
            <table class="tabla-carrito" id="tabla-pedidos" style="width: 100%; border-collapse: collapse; text-align: left;">
                <thead>
                    <tr style="border-bottom: 2px solid var(--color-border); font-family: 'Michroma', sans-serif; font-size: 0.85rem;">
                        <th style="padding: 15px 10px; width: 8%;">ID</th>
                        <th style="padding: 15px 10px; width: 22%;">Cliente</th>
                        <th style="padding: 15px 10px; width: 15%;">Fecha Pedido</th>
                        <th style="padding: 15px 10px; width: 15%;">Fecha Servicio</th>
                        <th style="padding: 15px 10px; width: 10%;">Total</th>
                        <th style="padding: 15px 10px; width: 15%;">Vehículo</th>
                        <th style="padding: 15px 10px; width: 10%;">Estado</th>
                        <th style="padding: 15px 10px; width: 15%;">Cambiar Estado</th>
                    </tr>
                </thead>
                <tbody id="tabla-body" style="font-size: 0.9rem;">
                    {{TABLA_PEDIDOS}}
                </tbody>
            </table>
        </div>
    </main>

</body>
</html>
