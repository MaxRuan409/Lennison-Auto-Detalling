<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Servicio | Lennison Auto Detailing</title>
    
    <!-- Biblioteca de íconos vectoriales FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- DISEÑO DE INTERFAZ PREMIUM INTEGRADO --- */
        :root {
            --color-bg: #000000;            /* Negro */
            --color-acento: #8B0000;        /* Rojo oscuro */
            --color-acento-hover: #b30000;  /* Rojo un poco más claro */
            --color-texto: #FFFFFF;         /* Blanco */
            --color-input-bg: #212121;      /* Gris oscuro */
            --color-border: #333333;        /* Borde gris */
            --radius-md: 8px;
            --radius-lg: 12px;
            --transition: all 0.3s ease;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--color-bg);
            color: var(--color-texto);
            margin: 0;
            padding: 0;
            display: block;
            min-height: 100vh;
        }

        /* --- Barra de Navegación --- */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 5%;
            background-color: var(--color-input-bg);
            border-bottom: 1px solid var(--color-border);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .navbar-brand {
            font-family: 'Michroma', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            text-decoration: none;
            color: var(--color-texto);
            text-transform: uppercase;
        }

        .navbar-brand span {
            color: var(--color-acento);
        }

        .btn-logout {
            padding: 0.6rem 1.2rem;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            background-color: transparent;
            color: var(--color-acento);
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-logout:hover {
            background-color: var(--color-acento);
            color: var(--color-texto);
            border-color: var(--color-acento);
        }

        /* --- Contenedor Principal --- */
        .dashboard-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .header-tienda {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--color-border);
            padding-bottom: 15px;
        }

        .header-tienda h2 {
            font-family: 'Michroma', sans-serif;
            font-size: 1.3rem;
            margin: 0;
        }

        .btn-volver {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background-color: var(--color-input-bg);
            color: var(--color-texto);
            text-decoration: none;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            font-weight: 600;
            transition: var(--transition);
        }

        .btn-volver:hover {
            border-color: var(--color-acento);
            color: var(--color-acento);
        }

        /* --- Formulario de Contenido --- */
        .form-wrapper {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        .contenedor-form {
            background-color: var(--color-input-bg);
            padding: 40px;
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 550px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid var(--color-border);
        }

        .grupo-input {
            margin-bottom: 20px;
        }

        .grupo-input label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #aaaaaa;
            font-weight: 600;
        }

        .grupo-input input,
        .grupo-input textarea {
            width: 100%;
            padding: 12px 16px;
            background-color: var(--color-bg);
            border: 1px solid var(--color-border);
            color: var(--color-texto);
            border-radius: var(--radius-md);
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            outline: none;
            transition: var(--transition);
            box-sizing: border-box;
        }

        .grupo-input textarea {
            resize: vertical;
            min-height: 100px;
        }

        .grupo-input input:focus,
        .grupo-input textarea:focus {
            border-color: var(--color-acento);
            box-shadow: 0 0 8px rgba(139, 0, 0, 0.2);
        }

        .btn-principal {
            width: 100%;
            padding: 14px;
            background-color: var(--color-acento);
            color: var(--color-texto);
            border: none;
            border-radius: var(--radius-md);
            font-family: 'Michroma', sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-principal:hover {
            background-color: var(--color-acento-hover);
            box-shadow: 0 5px 15px rgba(139, 0, 0, 0.4);
        }

        /* Toasts de Notificación */
        #toast-contenedor {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 12px;
            pointer-events: none;
        }

        .toast {
            min-width: 280px;
            max-width: 380px;
            padding: 14px 18px;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            line-height: 1.4;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .toast.toast-visible {
            opacity: 1;
            transform: translateY(0);
        }

        .toast-error {
            background-color: var(--color-acento);
            color: var(--color-texto);
            border: 1px solid var(--color-acento-hover);
        }

        .toast-exito {
            background-color: var(--color-input-bg);
            color: var(--color-texto);
            border: 2px solid var(--color-acento);
        }/* 1. Ajuste del contenedor de la barra de navegación */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.3rem 5% !important; /* Mantiene la barra compacta */
            background-color: var(--color-input-bg);
            border-bottom: 1px solid var(--color-border);
            box-shadow: var(--shadow-sm);
        }
        /* 2. Contenedor del logo con máscara de recorte (overflow: hidden) */
        .navbar-brand-logo {
            display: flex;
            align-items: center;
            text-decoration: none;
            height: 60px;       /* Altura del recuadro visible */
            width: 160px;       /* Ancho del recuadro visible */
            overflow: hidden;   /* Oculta y recorta los bordes negros que sobresalgan */
            position: relative;
        }

        /* 3. Imagen con zoom aplicado */
        .logo-navbar {
            height: 100%;
            width: 100%;
            object-fit: cover;   /* Ajusta la imagen para cubrir el contenedor */
            transform: scale(1.0); /* Aplica un 40% de zoom hacia el centro del logo */
            transform-origin: center;
            transition: all 0.3s ease;
        }

        .logo-navbar:hover {
            transform: scale(1.1); /* Efecto interactivo sutil sobre el zoom */
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="/admin" class="navbar-brand-logo" style="color: white; font-family: 'Michroma', sans-serif; text-decoration: none; font-size: 1.2rem; font-weight: bold; text-transform: uppercase; display: flex; align-items: center; width: auto; height: auto;">
            Lennison <span style="color: var(--color-acento); margin-left: 5px;">Detailing</span>
        </a>
        
        <div class="navbar-menu">
            <a href="/logout" class="btn-logout" style="text-decoration: none;">
                <i class="fa-solid fa-arrow-right-from-bracket"></i> Cerrar Sesión
            </a>
        </div>
    </nav>

    <main class="dashboard-container">
        <div class="header-tienda">
            <h2>Agregar Nuevo Servicio</h2>
            <a href="/admin" class="btn-volver">
                <i class="fa-solid fa-arrow-left"></i> Volver al Panel
            </a>
        </div>

        <div class="form-wrapper">
            <div class="contenedor-form">
                {{MENSAJE_FORM}}
                
                <form action="/admin/servicios/agregar" method="POST">
                    <div class="grupo-input">
                        <label for="nombre">Nombre del Servicio *</label>
                        <input type="text" id="nombre" name="nombre" required placeholder="Ej: Pulido 1 Paso">
                    </div>
                    <div class="grupo-input">
                        <label for="descripcion">Descripción *</label>
                        <textarea id="descripcion" name="descripcion" required placeholder="Detalles o alcance del servicio..." style="width: 100%; height: 100px; padding: 12px 16px; background-color: var(--color-bg); border: 1px solid var(--color-border); color: var(--color-texto); border-radius: var(--radius-md); font-family: 'Inter', sans-serif; box-sizing: border-box; outline: none; transition: var(--transition); resize: vertical;"></textarea>
                    </div>

                    <div style="display: flex; gap: 20px; margin-bottom: 25px;">
                        <div class="grupo-input" style="flex: 1;">
                            <label for="precio">Precio ($) *</label>
                            <input type="number" id="precio" name="precio" step="0.01" min="0" required placeholder="0.00">
                        </div>
                        
                        <div class="grupo-input" style="flex: 1;">
                            <label for="duracion">Duración (Minutos) *</label>
                            <input type="number" id="duracion" name="duracion" min="1" required placeholder="120">
                        </div>
                    </div>
                    
                    <button type="submit" class="btn-principal">
                        <i class="fa-solid fa-circle-check"></i> Guardar Servicio
                    </button>
                </form>
            </div>
        </div>
    </main>

</body>
</html>
